<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovládání Vlaku</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            margin-bottom: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .slider-container {
            margin: 2rem 0;
            position: relative;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 48px;
            width: 48px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -20px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
            border: 3px solid #fff;
            transition: transform 0.1s;
        }
        
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: linear-gradient(90deg, #ef4444 0%, #475569 50%, #10b981 100%);
            border-radius: 4px;
        }

        .speed-display {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--text-color);
            font-variant-numeric: tabular-nums;
        }

        .speed-label {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .btn-stop {
            background-color: var(--danger);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.3);
            text-transform: uppercase;
            transition: all 0.2s;
        }

        .btn-stop:hover {
            background-color: #dc2626;
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(239, 68, 68, 0.4);
        }

        .btn-stop:active {
            transform: translateY(1px);
        }

        .btn-lights {
            background-color: #475569;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .btn-lights.active {
            background-color: #eab308;
            color: #000;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
        }
        
        .status {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vlak Control</h1>
        
        <div class="speed-display" id="speedText">0 %</div>
        <div class="speed-label" id="directionText">Stojí</div>

        <div class="slider-container">
            <input type="range" id="speedSlider" min="-100" max="100" value="0">
        </div>

        <button class="btn-stop" onclick="stopTrain()">Nouzové Zastavení</button>
        <button class="btn-lights" id="lightBtn" onclick="toggleLights()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            Světla (Zapnout)
        </button>
        
        <div class="status" id="status">Připojeno k ESP32</div>
    </div>

    <script>
        const slider = document.getElementById('speedSlider');
        const speedText = document.getElementById('speedText');
        const directionText = document.getElementById('directionText');
        const lightBtn = document.getElementById('lightBtn');
        const statusEl = document.getElementById('status');

        let lightsOn = false;
        let pinger;

        slider.addEventListener('input', (e) => {
            updateSpeedDisplay(e.target.value);
        });

        slider.addEventListener('change', (e) => {
            updateSpeedDisplay(e.target.value);
            sendSpeed(e.target.value);
        });

        function updateSpeedDisplay(val) {
            speedText.innerText = Math.abs(val) + " %";
            if (val > 0) {
                directionText.innerText = "Jízda vpřed";
            } else if (val < 0) {
                directionText.innerText = "Jízda vzad";
            } else {
                directionText.innerText = "Stojí";
            }
        }

        function stopTrain() {
            slider.value = 0;
            updateSpeedDisplay(0);
            sendSpeed(0);
        }

        function toggleLights() {
            lightsOn = !lightsOn;
            if (lightsOn) {
                lightBtn.classList.add('active');
                lightBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg> Světla (Vypnout)';
            } else {
                lightBtn.classList.remove('active');
                lightBtn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg> Světla (Zapnout)';
            }
            fetch('/led?state=' + (lightsOn ? 1 : 0)).catch(e => console.log(e));
        }

        // Debounced speed sending
        let lastSendTime = 0;
        let pendingSpeed = null;
        
        function sendSpeed(val) {
            fetch('/speed?v=' + val).then(res => {
                if(res.ok) statusEl.innerText = "Spojení s motorem aktivní";
            }).catch(e => {
                statusEl.innerText = "Chyba připojení!";
                statusEl.style.color = "#ef4444";
            });
        }
        
        // Continuous slider sending to prevent lag when sliding slowly
        slider.addEventListener('input', (e) => {
            const now = Date.now();
            if(now - lastSendTime > 150) { // Every 150ms send update
                sendSpeed(e.target.value);
                lastSendTime = now;
            }
        });
        
    </script>
</body>
</html>
